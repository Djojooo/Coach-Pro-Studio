<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach Pro Studio</title>
<meta name="description" content="Cahier de séances d’entraînement de football avec tableau tactique animé et fiche PDF.">
<meta name="theme-color" content="#0a1528">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CP Studio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
/* Layout: app shell = session list | session sheet (header, intensity profile, block cards). Board editor = full-screen studio: palette | pitch | inspector, steps bar below. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f5f7fa; --ink:#0d1b2e; --muted:#5a6a80; --line:#d6dde7;
  --accent:#1d55d0; --accent-soft:#e3eafb; --on-accent:#ffffff;
  --ph-echauffement:#d4860a; --ph-forme:#1d55d0; --ph-conservation:#0f7f9c; --ph-vitesse:#c0392b; --ph-athletique:#7b4fd6; --ph-tactique:#b3236a; --ph-jeu:#2e8a3a;
  --danger:#c3352c; --ok:#1d8a4e; --stage:#d7dee8; --scrim:rgba(10,21,40,.45);
  --shadow:0 1px 2px rgba(13,27,46,.06),0 6px 20px rgba(13,27,46,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1528; --panel:#0f1d33; --panel-2:#13233d; --ink:#e7edf6; --muted:#8b9cb6; --line:#22344f;
  --accent:#5d8dff; --accent-soft:#1a2c52; --on-accent:#06101f;
  --ph-echauffement:#f0a52a; --ph-forme:#5d8dff; --ph-conservation:#3fb4d4; --ph-vitesse:#ef6a5a; --ph-athletique:#a585ff; --ph-tactique:#e25b9c; --ph-jeu:#57c065;
  --danger:#ef5a50; --ok:#3cc47a; --stage:#071021; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1528; --panel:#0f1d33; --panel-2:#13233d; --ink:#e7edf6; --muted:#8b9cb6; --line:#22344f;
  --accent:#5d8dff; --accent-soft:#1a2c52; --on-accent:#06101f;
  --ph-echauffement:#f0a52a; --ph-forme:#5d8dff; --ph-conservation:#3fb4d4; --ph-vitesse:#ef6a5a; --ph-athletique:#a585ff; --ph-tactique:#e25b9c; --ph-jeu:#57c065;
  --danger:#ef5a50; --ok:#3cc47a; --stage:#071021; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* top bar */
.topbar{overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.brand small{font-weight:600;color:var(--accent);font-size:22px}
.brand svg{flex:none}
.status{min-width:0;overflow:hidden;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.status span{overflow:hidden;text-overflow:ellipsis}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-s="ok"] i{background:var(--ok)}
.status[data-s="saving"] i{background:var(--ph-echauffement)}
.status[data-s="error"] i{background:var(--danger)}
.status[data-s="example"] i{background:var(--accent)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap;line-height:1.1}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:7px 9px}
.btn svg{width:16px;height:16px;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.only-mobile{display:none}

/* shell */
.shell{display:grid;grid-template-columns:288px 1fr;min-height:0}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:14px 14px 10px;display:grid;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px}
.slist{overflow:auto;padding:4px 8px 16px;flex:1;display:grid;align-content:start;gap:2px}
.sitem{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px}
.srow{position:relative}
.srow .sitem{width:100%;padding-right:34px}
.sdel{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;opacity:0}
.sdel svg{width:14px;height:14px}
.srow:hover .sdel,.sdel:focus-visible{opacity:1}
.sdel:hover{background:var(--panel);color:var(--danger)}
@media (hover:none){.sdel{opacity:.8}}
.sitem:hover{background:var(--panel-2)}
.sitem.on{background:var(--accent-soft)}
.sdate{font-family:var(--f-display);font-weight:700;text-align:center;line-height:1;border:1px solid var(--line);border-radius:7px;padding:5px 0;background:var(--panel)}
.sdate b{display:block;font-size:19px}
.sdate span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stitle{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smeta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.side-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:8px}
.foot-btns{display:flex;gap:6px}
.foot-btns .btn{flex:1;font-size:13px;padding:6px 8px}
.empty-note{padding:12px;color:var(--muted);font-size:13px}

/* main plan */
.main{overflow:auto;min-width:0}
.plan{max-width:1120px;margin:0 auto;padding-block:20px 60px;padding-inline:20px;display:grid;gap:18px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner b{font-weight:600}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.sheet-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.title-in{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;border:0;background:transparent;width:100%;padding:2px 0;border-bottom:1px dashed transparent}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line);outline:none}
.title-wrap{flex:1 1 360px;min-width:0}
.kpis{display:flex;gap:6px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:84px;background:var(--panel-2)}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.meta-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:7px 9px;min-width:0}
.fld textarea{resize:vertical;min-height:62px;field-sizing:content;max-height:260px;line-height:1.4}
.fld.span2{grid-column:span 2}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:grid;gap:12px}
.panel-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
h2{font-size:24px}
h3{font-size:19px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.profile{display:flex;gap:3px;height:96px;align-items:flex-end;border-bottom:1px solid var(--line)}
.seg{position:relative;height:100%;display:flex;align-items:flex-end;min-width:14px}
.seg .bar{width:100%;height:var(--h);background:var(--c);border-radius:4px 4px 0 0;opacity:.88;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px;overflow:hidden}
.seg .rpe{position:absolute;top:0;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.axis{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:6px}
.equip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:3px 10px;font-size:13px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.chip i{width:9px;height:9px;border-radius:50%}
.muted{color:var(--muted)}
.blocks-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blocks{display:grid;gap:14px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.idx{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--pc);flex:none}
[data-phase="echauffement"]{--pc:var(--ph-echauffement)}
[data-phase="forme"]{--pc:var(--ph-forme)}
[data-phase="conservation"]{--pc:var(--ph-conservation)}
[data-phase="vitesse"]{--pc:var(--ph-vitesse)}
[data-phase="athletique"]{--pc:var(--ph-athletique)}
[data-phase="tactique"]{--pc:var(--ph-tactique)}
[data-phase="jeu"]{--pc:var(--ph-jeu)}
.block-name{flex:1 1 220px;min-width:0;font-family:var(--f-display);font-weight:700;font-size:21px;border:0;background:transparent;padding:2px 0;border-bottom:1px dashed transparent}
.block-name:hover,.block-name:focus{border-bottom-color:var(--line);outline:none}
.phase-sel{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px 8px;font-size:13px;font-weight:600;color:var(--pc)}
.btime{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:2px}
.block-body{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;padding:14px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--stage);display:block;width:100%;aspect-ratio:var(--ar,1.4);max-width:100%}
.thumb canvas{width:100%;height:100%;display:block}
.thumb .cta{position:absolute;right:8px;bottom:8px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;border-radius:6px;padding:5px 9px;opacity:.92}
.thumb:hover .cta{background:var(--accent);color:var(--on-accent)}
.thumb-col{display:grid;gap:8px;align-content:start}
.thumb-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.bfields{display:grid;grid-template-columns:90px repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.bfields .full{grid-column:1/-1}
.bfields .half{grid-column:span 2}
.rpe-row{display:flex;align-items:center;gap:10px}
.rpe-row input{flex:1;accent-color:var(--pc)}
.rpe-row output{font-family:var(--f-display);font-weight:700;font-size:20px;width:28px;text-align:right;font-variant-numeric:tabular-nums}
.add-row{display:flex;gap:10px;flex-wrap:wrap}

/* drawer for mobile */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}

/* editor */
.editor{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-top{display:flex;align-items:center;gap:10px;padding:8px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.ed-title{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.ed-title b{font-family:var(--f-display);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-body{display:grid;grid-template-columns:176px minmax(0,1fr) 272px;min-height:0}
.palette{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 8px 20px}
.pgroup{margin-bottom:10px}
.pgroup h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 4px;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tool{display:grid;justify-items:center;gap:2px;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 2px 4px;font-size:11px;line-height:1.15;text-align:center}
.tool:hover{background:var(--panel-2)}
.tool.on{border-color:var(--accent);background:var(--accent-soft)}
.tool canvas{width:30px;height:30px;border-radius:5px;background:#3b8a45}
.tool kbd{font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.stage{position:relative;background:var(--stage);min-height:0;min-width:0;overflow:hidden}
.stage canvas{position:absolute;inset:0;touch-action:none;display:block}
.stage-hint{position:absolute;left:12px;bottom:10px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--muted);pointer-events:none;max-width:calc(100% - 24px)}
.coords{position:absolute;right:12px;bottom:10px;font-family:var(--f-mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted);pointer-events:none}
.inspector{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px 14px 30px;display:grid;align-content:start;gap:14px}
.ins-sec{display:grid;gap:8px}
.ins-sec>h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.ins-title{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ins-row{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:8px;font-size:13px}
.ins-row>span{color:var(--muted)}
.ins-row output{font-family:var(--f-mono);font-size:11.5px;min-width:42px;text-align:right}
.ins-row input[type=range]{width:100%;accent-color:var(--accent)}
.ins-row input[type=text],.ins-row input[type=number],.ins-row select,.ins-sec textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 8px;min-width:0}
.ins-row.two{grid-template-columns:92px 1fr}
.ins-row.fm{grid-template-columns:62px minmax(0,1fr) auto}
.seg-ctl{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg-ctl button{flex:1;border:0;background:var(--panel-2);padding:6px 4px;font-size:12.5px;font-weight:600;border-right:1px solid var(--line)}
.seg-ctl button:last-child{border-right:0}
.seg-ctl button.on{background:var(--accent);color:var(--on-accent)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--sw);font-size:10px;font-weight:700;color:var(--muted);padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.btn-row{display:flex;flex-wrap:wrap;gap:6px}
.btn-row .btn{font-size:13px;padding:6px 10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.xy{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.help{font-size:12.5px;color:var(--muted);line-height:1.5}
.help kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel-2)}
.frames{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.frames .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.fchip{min-width:34px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--f-display);font-weight:700;font-size:17px}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.frames .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.frames select{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 6px;font-size:13px}
.ins-toggle{display:none}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(820px,100%);max-height:min(86vh,900px);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.dialog.small{width:min(440px,100%)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-body{overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:12px}
.lib-card{border:1px solid var(--line);border-radius:9px;overflow:hidden;display:grid;background:var(--panel-2)}
.lib-card canvas{width:100%;aspect-ratio:1.4;display:block;background:var(--stage)}
.lc-tags{display:flex;flex-wrap:wrap;gap:5px}
.tpl-list{margin:0;padding-left:18px;font-size:12.5px;display:grid;gap:2px}
.tpl-list li i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pc);margin-right:6px;vertical-align:1px}
.tpl-blank{align-content:center;border-style:dashed;background:transparent}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:1px 8px;background:var(--panel)}
.tag i,.fchip-c i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.lib-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const nid=p=>p+'-'+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const fmtM=v=>(Math.round(v*10)/10).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const FD='"Barlow Condensed","Arial Narrow",Arial,sans-serif', FB='Barlow,system-ui,sans-serif', FM='"IBM Plex Mono",Menlo,monospace';
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* ============ domain constants ============ */
const TEAM={home:'#1f5fd1',away:'#d8312f',neutral:'#f2b705',gk:'#16a36b'};
const TEAM_LBL={home:'Domicile',away:'Adverse',neutral:'Neutre',gk:'Gardien'};
const PHASES={echauffement:'Échauffement',forme:'Forme jouée',conservation:'Conservation',vitesse:'Vitesse / Vivacité',athletique:'Travail athlétique',tactique:'Situation tactique',jeu:'Jeu'};
const PH_RGB={echauffement:[212,134,10],forme:[29,85,208],conservation:[15,127,156],vitesse:[192,57,43],athletique:[123,79,214],tactique:[179,35,106],jeu:[46,138,58]};
const PH_OLD={principal:'tactique',retour:'jeu'};
const phRGB=k=>PH_RGB[k]||PH_RGB.forme;
function normalize(s){
  if(!s||!Array.isArray(s.blocks))return s;
  if(s.num==null)s.num='';delete s.cycle;
  s.blocks.forEach(b=>{if(PH_OLD[b.phase])b.phase=PH_OLD[b.phase];if(!PHASES[b.phase])b.phase='forme';
    const extra=[b.obj?'Objectif : '+b.obj:'',b.coach?'Coaching : '+b.coach:''].filter(Boolean);
    if(extra.length)b.org=[b.org,...extra].filter(Boolean).join('\n');
    delete b.obj;delete b.coach;delete b.format;delete b.rpe;});
  return s;
}
const THEMES=['Jeu de position','Conservation','Bloc médian','Pressing','Transitions','Construction','Finition','Coups de pied arrêtés','Physique intégré','Reprise / récupération'];
const COLORS=['#1f5fd1','#d8312f','#f2b705','#16a36b','#f47a20','#7b4fd6','#e23d7a','#ffffff','#0d1b2e'];
const POINT=new Set(['player','ball','cone','marker','pole','ring','hurdle','ladder','mannequin','minigoal','goal','flag']);
const ZONES=new Set(['rect','ellipse']);
const LINES=new Set(['line','measure','free']);
const KIND_LBL={pass:'Passe',run:'Course',dribble:'Conduite',shot:'Tir',line:'Trait'};
const OBJ_LBL={player:'Joueur',ball:'Ballon',cone:'Plot',marker:'Coupelle',pole:'Piquet',ring:'Cerceau',hurdle:'Haie',ladder:'Échelle de rythme',mannequin:'Mannequin',minigoal:'Mini-but',goal:'But',flag:'Drapeau',line:'Ligne',measure:'Mesure',free:'Dessin libre',rect:'Zone',ellipse:'Zone ronde',text:'Texte'};
const EQUIP=[['ball','Ballons'],['cone','Plots'],['marker','Coupelles'],['pole','Piquets'],['ring','Cerceaux'],['hurdle','Haies'],['ladder','Échelles'],['mannequin','Mannequins'],['minigoal','Mini-buts'],['goal','Buts'],['flag','Drapeaux']];
const TOOLS=[
 ['Sélection',[['select','Sélection','V'],['measure','Mesurer','M']]],
 ['Joueurs',[['p-home','Domicile','1'],['p-away','Adverse','2'],['p-neutral','Neutre','3'],['p-gk','Gardien','4']]],
 ['Ballon & buts',[['ball','Ballon','B'],['goal','But',''],['minigoal','Mini-but','']]],
 ['Matériel',[['cone','Plot','C'],['marker','Coupelle',''],['pole','Piquet',''],['ring','Cerceau',''],['hurdle','Haie',''],['ladder','Échelle',''],['mannequin','Mannequin',''],['flag','Drapeau','']]],
 ['Lignes',[['pass','Passe','A'],['run','Course','R'],['dribble','Conduite','D'],['shot','Tir',''],['line','Trait',''],['free','Crayon','F']]],
 ['Zones & texte',[['rect','Zone','Z'],['ellipse','Zone ronde',''],['text','Texte','T']]],
];
const FORMATIONS={
 '4-2-3-1':[[5,34,1],[30,58,2],[24,42,4],[24,26,5],[30,10,3],[40,41,8],[40,27,6],[55,58,7],[54,34,10],[55,10,11],[66,34,9]],
 '4-3-3':[[5,34,1],[30,58,2],[24,42,4],[24,26,5],[30,10,3],[38,34,6],[47,46,8],[47,22,10],[62,58,7],[66,34,9],[62,10,11]],
 '4-4-2':[[5,34,1],[30,58,2],[24,42,4],[24,26,5],[30,10,3],[46,58,7],[42,40,6],[42,28,8],[46,10,11],[60,27,10],[62,40,9]],
 '3-5-2':[[5,34,1],[24,50,4],[22,34,5],[24,18,3],[42,62,2],[38,34,6],[46,46,8],[46,22,10],[42,6,11],[62,40,9],[62,28,7]],
 '4-4-2 bloc médian':[[6,34,1],[30,54,2],[30,41,4],[30,27,5],[30,14,3],[40,56,7],[40,40,8],[40,28,6],[40,12,11],[50,39,10],[50,29,9]],
};

/* ============ board model ============ */
function newBoard(view='zone',zw=40,zh=30){return {view,zw,zh,style:'grass',overlay:'none',objs:[],frames:[{}]}}
function fieldRect(b){return b.view==='zone'?{x:0,y:0,w:b.zw,h:b.zh}:{x:0,y:0,w:105,h:68}}
function viewRect(b){
  switch(b.view){
    case 'half':return {x:49,y:-4,w:62,h:76};
    case 'three':return {x:22,y:-4,w:89,h:76};
    case 'zone':{const p=Math.max(1.6,Math.max(b.zw,b.zh)*.07);return {x:-p,y:-p,w:b.zw+2*p,h:b.zh+2*p}}
    default:return {x:-6,y:-4,w:117,h:76};
  }
}
function boardAspect(b){const v=viewRect(b);return v.w/v.h}
function cam(b,W,H){
  const v=viewRect(b),s=Math.min(W/v.w,H/v.h);
  const ox=(W-v.w*s)/2-v.x*s,oy=(H-v.h*s)/2-v.y*s;
  const u=Math.sqrt(v.w*s*v.h*s)/64;
  return {s,ox,oy,u,v};
}
const w2s=(c,x,y)=>[c.ox+x*c.s,c.oy+y*c.s];
function posAt(b,o,f){
  for(let i=Math.min(f,b.frames.length-1);i>=1;i--){const p=b.frames[i]&&b.frames[i][o.id];if(p)return p}
  return {x:o.x,y:o.y};
}
function visibleAt(o,f){return POINT.has(o.t)||o.step==null||o.step===f}
function layer(o){return ZONES.has(o.t)?0:(o.t==='line'||o.t==='free'||o.t==='measure')?1:POINT.has(o.t)?2:3}
function ordered(b){return b.objs.map((o,i)=>[o,i]).sort((a,c)=>layer(a[0])-layer(c[0])||a[1]-c[1]).map(a=>a[0])}

/* ============ pitch drawing ============ */
const PSTYLE={
  grass:{out:'#2e6f37',a:'#3a8944',b:'#43934d',line:'rgba(255,255,255,.9)',ink:'#ffffff',over:'rgba(255,255,255,.55)',tint:'rgba(255,255,255,.07)'},
  board:{out:'#142238',a:'#1b2c46',b:'#1e304c',line:'rgba(226,235,248,.72)',ink:'#f1f5fb',over:'rgba(226,235,248,.42)',tint:'rgba(226,235,248,.06)'},
  print:{out:'#ffffff',a:'#ffffff',b:'#f2f4f7',line:'#7a879c',ink:'#16243a',over:'rgba(60,75,100,.45)',tint:'rgba(60,75,100,.06)'},
};
function drawPitch(ctx,b,c,W,H,P){
  const s=c.s,v=c.v,F=fieldRect(b);
  ctx.fillStyle=P.out;ctx.fillRect(0,0,W,H);
  const [vx,vy]=w2s(c,v.x,v.y);
  ctx.fillStyle=P.a;ctx.fillRect(vx,vy,v.w*s,v.h*s);
  const band=b.view==='zone'?Math.max(2,F.w/8):105/18;
  ctx.fillStyle=P.b;
  for(let x=Math.floor(v.x/band)*band,k=Math.floor(v.x/band);x<v.x+v.w;x+=band,k++){
    if(k%2===0){const x0=Math.max(x,v.x),x1=Math.min(x+band,v.x+v.w);ctx.fillRect(c.ox+x0*s,vy,(x1-x0)*s,v.h*s)}
  }
  ctx.save();
  ctx.beginPath();ctx.rect(vx,vy,v.w*s,v.h*s);ctx.clip();
  // overlays
  drawOverlay(ctx,b,c,P,F);
  const lw=Math.max(1.1,.13*s);
  ctx.strokeStyle=P.line;ctx.lineWidth=lw;ctx.lineJoin='round';
  const X=x=>c.ox+x*s,Y=y=>c.oy+y*s;
  const R=(x,y,w,h)=>{ctx.strokeRect(X(Math.min(x,x+w)),Y(Math.min(y,y+h)),Math.abs(w)*s,Math.abs(h)*s)};
  const dot=(x,y)=>{ctx.beginPath();ctx.arc(X(x),Y(y),Math.max(1.5,.22*s),0,7);ctx.fillStyle=P.line;ctx.fill()};
  if(b.bare){}
  else if(b.view==='zone'){
    R(0,0,F.w,F.h);
    ctx.fillStyle=P.ink;ctx.globalAlpha=.75;ctx.font=`500 ${clamp(c.u*.82,9,13)}px ${FM}`;ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(fmtDim(F.w)+' m',X(F.w/2),Y(0)-3);
    ctx.save();ctx.translate(X(0)-3,Y(F.h/2));ctx.rotate(-Math.PI/2);ctx.fillText(fmtDim(F.h)+' m',0,0);ctx.restore();
    ctx.globalAlpha=1;
  } else if(b.view!=='blank'){
    R(0,0,105,68);
    ctx.beginPath();ctx.moveTo(X(52.5),Y(0));ctx.lineTo(X(52.5),Y(68));ctx.stroke();
    ctx.beginPath();ctx.arc(X(52.5),Y(34),9.15*s,0,7);ctx.stroke();dot(52.5,34);
    for(const side of [0,1]){
      const x0=side?105:0,d=side?-1:1;
      R(x0,13.84,d*16.5,40.32);R(x0,24.84,d*5.5,18.32);dot(x0+d*11,34);
      const a=Math.acos(5.5/9.15);
      ctx.beginPath();
      if(side)ctx.arc(X(94),Y(34),9.15*s,Math.PI-a,Math.PI+a);else ctx.arc(X(11),Y(34),9.15*s,-a,a);
      ctx.stroke();
      ctx.save();ctx.lineWidth=lw*1.6;ctx.strokeStyle=P.ink;R(x0,30.34,-d*2,7.32);ctx.restore();
      for(const cy of [0,68]){ctx.beginPath();ctx.arc(X(x0),Y(cy),1*s,cy?(side?Math.PI:1.5*Math.PI):(side?.5*Math.PI:0),cy?(side?1.5*Math.PI:2*Math.PI):(side?Math.PI:.5*Math.PI));ctx.stroke()}
    }
  }
  if(b.midline&&b.view!=='full'&&!b.bare){
    const Q=playRect(b),mx=Q.x+Q.w/2;
    ctx.save();ctx.strokeStyle=P.ink;ctx.lineWidth=lw*1.25;ctx.beginPath();ctx.moveTo(X(mx),Y(Q.y));ctx.lineTo(X(mx),Y(Q.y+Q.h));ctx.stroke();ctx.restore();
    dot(mx,Q.y+Q.h/2);
  }
  ctx.restore();
}
function fmtDim(v){return Number.isInteger(v)?String(v):fmtM(v)}
function drawOverlay(ctx,b,c,P,F){
  const o=b.overlay;if(!o||o==='none')return;
  const X=x=>c.ox+x*c.s,Y=y=>c.oy+y*c.s;
  ctx.save();ctx.strokeStyle=P.over;ctx.lineWidth=Math.max(1,c.s*.09);ctx.setLineDash([c.u*.55,c.u*.4]);
  const hl=y=>{ctx.beginPath();ctx.moveTo(X(F.x),Y(y));ctx.lineTo(X(F.x+F.w),Y(y));ctx.stroke()};
  const vl=x=>{ctx.beginPath();ctx.moveTo(X(x),Y(F.y));ctx.lineTo(X(x),Y(F.y+F.h));ctx.stroke()};
  if(o==='couloirs'||o==='couloirs_tiers'){
    const r=[13.84,24.84,43.16,54.16].map(v=>v/68*F.h);
    ctx.fillStyle=P.tint;ctx.fillRect(X(F.x),Y(r[0]),F.w*c.s,(r[1]-r[0])*c.s);ctx.fillRect(X(F.x),Y(r[2]),F.w*c.s,(r[3]-r[2])*c.s);
    r.forEach(hl);
  }
  if(o==='tiers'||o==='couloirs_tiers'){vl(F.w/3);vl(2*F.w/3)}
  if(o==='zones18'){for(let k=1;k<6;k++)vl(F.w*k/6);hl(F.h/3);hl(2*F.h/3)}
  if(o==='grille'){for(let k=1;k<3;k++){vl(F.w*k/3);hl(F.h*k/3)}}
  if(o==='moities'){vl(F.w/2)}
  ctx.restore();
}

/* ============ object drawing ============ */
function contrast(hex){
  if(!hex||hex[0]!=='#')return '#fff';
  const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  return (r*299+g*587+b*114)/1000>150?'#0d1b2e':'#ffffff';
}
function shirtPath(ctx,w){
  ctx.beginPath();ctx.moveTo(-w*.42,-w*.95);ctx.lineTo(-w*1.08,-w*.52);ctx.lineTo(-w*.82,-w*.02);ctx.lineTo(-w*.6,-w*.18);
  ctx.lineTo(-w*.6,w*.98);ctx.lineTo(w*.6,w*.98);ctx.lineTo(w*.6,-w*.18);ctx.lineTo(w*.82,-w*.02);ctx.lineTo(w*1.08,-w*.52);
  ctx.lineTo(w*.42,-w*.95);ctx.quadraticCurveTo(0,-w*.55,-w*.42,-w*.95);ctx.closePath();
}
function pR(o,c){
  const u=c.u*(o.size||1);
  switch(o.t){
    case 'player':return 1.12*u;case 'ball':return .6*u;case 'cone':return .7*u;case 'marker':return .55*u;
    case 'pole':return .9*u;case 'ring':return .95*u;case 'hurdle':return 1*u;case 'mannequin':return 1.25*u;case 'flag':return 1*u;
    case 'goal':case 'minigoal':return Math.max(o.w/2*c.s,7);case 'ladder':return Math.max(o.len/2*c.s,7);
  }
  return u;
}
function drawPoint(ctx,o,q,c,P){
  const [X,Y]=w2s(c,q.x,q.y),u=c.u*(o.size||1);
  ctx.save();ctx.translate(X,Y);
  switch(o.t){
    case 'player':{

const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('coachpro-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})},
  run(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('docs',mode),req=fn(t.objectStore('docs'));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(){return this.run('readonly',st=>st.getAll())},
  put(d){return this.run('readwrite',st=>st.put(d))},
  del(id){return this.run('readwrite',st=>st.delete(id))},
  putMany(list){return this.run('readwrite',st=>{let r;for(const d of list)r=st.put(d);return r})},
};

async function initStore(){
  try{
    if(!window.indexedDB)throw new Error('no idb');
    IDB.db=await IDB.open();S.store={mode:'idb'};
    let docs=await IDB.all();
    if(!docs.length){const d=lsRead();if(d){const list=[...(d.sessions||[]).map(x=>({...x,kind:'session'})),...(d.exercises||[]).map(x=>({...x,kind:'exercise'}))];if(list.length){await IDB.putMany(list);docs=await IDB.all()}}}
    docs.forEach(ingest);
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  }catch(e){
    S.store={mode:'local'};
    const d=lsRead();if(d){(d.sessions||[]).forEach(x=>ingest({...x,kind:'session'}));(d.exercises||[]).forEach(x=>ingest({...x,kind:'exercise'}))}
  }

const MIME={pdf:'application/pdf',png:'image/png',json:'application/json',webm:'video/webm',mp4:'video/mp4'};
async function saveFile(filename,data){
  const ext=(filename.split('.').pop()||'').toLowerCase(),type=MIME[ext]||'application/octet-stream';
  const blob=data instanceof Blob&&data.type?data:new Blob([data],{type});
  let file=null;try{file=new File([blob],filename,{type})}catch{}
  const touchDevice=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  if(touchDevice&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast('Téléchargement lancé : '+filename);
}

function renderThumbs(){
  $$('canvas[data-thumb]').forEach(cv=>{const b=blockById(cv.dataset.thumb);if(!b)return;paintThumb(cv,b.board)});
}
function paintThumb(cv,board){
  const r=cv.getBoundingClientRect(),w=Math.max(120,r.width||360),h=Math.max(80,r.height||(w/boardAspect(board))),d=window.devicePixelRatio||1;
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);drawBoard(x,board,w,h,{frame:0});
}
function blockById(id){return S.cur.blocks.find(b=>b.id===id)}
function updateDerived(){
  const s=S.cur,tot=totalDur(s),t0=startMin(s);
  $('#kDur').textContent=tot+'′';$('#kEnd').textContent=hm(t0+tot);
  // equipment
  const eq={};let maxAway=0,maxNeutral=0,maxHome=0;
  s.blocks.forEach(b=>{const c={};let a=0,n=0,h=0;b.board.objs.forEach(o=>{c[o.t]=(c[o.t]||0)+1;if(o.t==='player'){if(o.team==='away')a++;if(o.team==='neutral')n++;if(o.team==='home')h++}});
    for(const k in c)eq[k]=Math.max(eq[k]||0,c[k]);maxAway=Math.max(maxAway,a);maxNeutral=Math.max(maxNeutral,n);maxHome=Math.max(maxHome,h)});
  const chips=EQUIP.filter(([k])=>eq[k]).map(([k,l])=>`<span class="chip"><b>${eq[k]}</b> ${l.toLowerCase()}</span>`);
  if(maxAway||maxNeutral)chips.push(`<span class="chip">Chasubles${maxAway?` · <i style="background:${TEAM.away}"></i><b>${maxAway}</b>`:''}${maxNeutral?` · <i style="background:${TEAM.neutral}"></i><b>${maxNeutral}</b>`:''}</span>`);
  $('#equip').innerHTML=`<span class="eyebrow" style="margin-right:4px">Matériel (max. par exercice)</span>${chips.join('')||'<span class="muted" style="font-size:13px">Place du matériel sur les tableaux pour le compter ici.</span>'}`;
  let a2=t0;$$('.block').forEach((el,i)=>{const b=s.blocks[i];if(!b)return;const st=a2;a2+=+b.dur||0;const t=el.querySelector('[data-time]');if(t)t.textContent=hm(st)+' – '+hm(a2)});
}
$('#main').addEventListener('input',e=>{
  const el=e.target,s=S.cur;
  if(el.dataset.sf){const k=el.dataset.sf;s[k]=el.type==='number'?(+el.value||0):el.value;touch();updateDerived();return}
  if(el.dataset.bf){const blk=blockById(el.closest('[data-bid]').dataset.bid),k=el.dataset.bf;
    blk[k]=k==='dur'?(+el.value||0):el.value;
    touch();updateDerived();
    if(k==='phase')el.closest('.block').dataset.phase=el.value;
  }
});
$('#main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,s=S.cur;
  const card=b.closest('[data-bid]'),blk=card&&blockById(card.dataset.bid),i=blk?s.blocks.indexOf(blk):-1;
  switch(act){
    case 'new':openNewSession();break;
    case 'add':s.blocks.push(newBlock('forme'));touch();renderBlocks();updateDerived();$('#blocks').lastElementChild?.scrollIntoView({behavior:'smooth',block:'center'});break;
    case 'add-lib':openLibrary();break;
    case 'edit':openEditor(blk.id);break;
    case 'up':if(i>0){[s.blocks[i-1],s.blocks[i]]=[s.blocks[i],s.blocks[i-1]];touch();renderBlocks();updateDerived()}break;
    case 'down':if(i<s.blocks.length-1){[s.blocks[i+1],s.blocks[i]]=[s.blocks[i],s.blocks[i+1]];touch();renderBlocks();updateDerived()}break;
    case 'dup':{const c=clone(blk);c.id=nid('b');c.name+=' (copie)';s.blocks.splice(i+1,0,c);touch();renderBlocks();updateDerived();break}
    case 'lib':saveExercise(blk);break;
    case 'del':confirmBox(`Supprimer « ${esc(blk.name)} » ?`,'Le schéma et les consignes de cet exercice seront perdus.','Supprimer',()=>{s.blocks.splice(i,1);touch();renderBlocks();updateDerived()});break;
  }
});

function confirmBox(title,text,okLbl,onOk){

}

/* pointer interaction */
function sp(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function toW(p){const c=ED.cam;return {x:(p[0]-c.ox)/c.s,y:(p[1]-c.oy)/c.s}}
function snapV(v){return ED.snap?Math.round(v*2)/2:v}
function hitObj(o,p,c){
  const f=ED.frame;if(!visibleAt(o,f))return false;
  if(POINT.has(o.t)){const q=posAt(ED.b,o,f),[X,Y]=w2s(c,q.x,q.y);let r=pR(o,c)+4;if(o.t==='pole'||o.t==='flag'||o.t==='mannequin')return Math.abs(p[0]-X)<r&&p[1]<Y+r&&p[1]>Y-r*2.2;return Math.hypot(p[0]-X,p[1]-Y)<r}
  if(o.t==='line')return distPoly(p,samples(lineGeom(o,c),24))<8;
  if(o.t==='measure'||o.t==='free')return distPoly(p,o.pts.map(q=>w2s(c,q.x,q.y)))<8;
  const bb=bbox(o,c,f,ED.b);if(!bb)return false;
  if(o.t==='ellipse'){const cx=bb.x+bb.w/2,cy=bb.y+bb.h/2;return ((p[0]-cx)/(bb.w/2+4))**2+((p[1]-cy)/(bb.h/2+4))**2<=1}
  return p[0]>=bb.x-4&&p[0]<=bb.x+bb.w+4&&p[1]>=bb.y-4&&p[1]<=bb.y+bb.h+4;
}
function distPoly(p,s){let m=1e9;for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i],dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L;t=clamp(t,0,1);m=Math.min(m,Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy))}return m}
function hit(p){const objs=ordered(ED.b);for(let i=objs.length-1;i>=0;i--)if(hitObj(objs[i],p,ED.cam))return objs[i];return null}
function selObjs(){return ED.b.objs.filter(o=>ED.sel.has(o.id))}
function getPos(o){return posAt(ED.b,o,ED.frame)}
function setPos(o,x,y){if(ED.frame===0){o.x=x;o.y=y}else ED.b.frames[ED.frame][o.id]={x,y}}
function snapshotGeom(o){if(POINT.has(o.t)){const q=getPos(o);return {x:q.x,y:q.y}}if(o.pts)return {pts:o.pts.map(p=>({...p}))};return {x:o.x,y:o.y}}
function translate(o,g,dx,dy){
  if(POINT.has(o.t))setPos(o,snapV(g.x+dx),snapV(g.y+dy));
  else if(g.pts)o.pts=g.pts.map(p=>({x:p.x+dx,y:p.y+dy}));
  else{o.x=g.x+dx;o.y=g.y+dy}
}
cv.addEventListener('pointerdown',e=>{
  if(!ED.b||!ED.cam)return;if(e.button>0)return;
  if(ED.playing){stopPlay()}
  cv.setPointerCapture(e.pointerId);
  const p=sp(e),w=toW(p),t=ED.tool,snap=JSON.stringify(ED.b);
  if(t==='select'){
    const one=ED.sel.size===1?selObjs()[0]:null;
    if(one){const h=handles(one,ED.cam).find(h=>Math.hypot(h.p[0]-p[0],h.p[1]-p[1])<9);if(h){ED.drag={mode:'handle',k:h.k,o:one,snap,moved:false};return}}

    }

  }
  if(t.startsWith('p-')||POINT.has(t)){

    ED.b.objs.push(o);ED.sel=new Set([o.id]);

  }

    ED.b.objs.push(o);ED.drag={mode:'create',o,a:p};draw();return;
  }
  if(t==='free'){pushUndo();const o={id:nid('o'),t:'free',pts:[{x:w.x,y:w.y}],color:null,w:1,step};ED.b.objs.push(o);ED.drag={mode:'free',o};return}
  if(t==='rect'||t==='ellipse'){pushUndo();const o=mk.Z(t,w.x,w.y,0,0,{step});ED.b.objs.push(o);ED.drag={mode:'zone',o,start:w,a:p};return}
  if(t==='text'){pushUndo();const o=mk.T(w.x,w.y,'Texte',{step,bg:true});ED.b.objs.push(o);ED.sel=new Set([o.id]);setTool('select');renderInspector();commit();
    setTimeout(()=>{const ta=$('#inspector textarea[data-prop="text"]');if(ta){ta.focus();ta.select()}},30);}
});
cv.addEventListener('pointermove',e=>{
  if(!ED.b||!ED.cam)return;const p=sp(e),w=toW(p);
  const co=$('#coords');co.hidden=false;co.textContent=`x ${fmtM(w.x)} m · y ${fmtM(w.y)} m`;
  const d=ED.drag;if(!d)return;
  if(d.mode==='move'){
    const dx=w.x-d.start.x,dy=w.y-d.start.y;if(!d.moved&&Math.hypot(dx,dy)*ED.cam.s<3)return;d.moved=true;
    for(const o of selObjs()){const g=d.orig.get(o.id);if(g)translate(o,g,dx,dy)}draw();updateXY();
  } else if(d.mode==='handle'){
    d.moved=true;const o=d.o;
    if(o.t==='line'||o.t==='measure'){
      if(d.k==='a')o.pts[0]={x:w.x,y:w.y};else if(d.k==='b')o.pts[1]={x:w.x,y:w.y};
      else{const a=o.pts[0],b=o.pts[1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,L=Math.hypot(b.x-a.x,b.y-a.y)||1,nx=-(b.y-a.y)/L,ny=(b.x-a.x)/L;o.c=Math.round(((w.x-mx)*nx+(w.y-my)*ny)*10)/10;const sl=$('#inspector [data-prop="c"]');if(sl){sl.value=o.c;sl.nextElementSibling.textContent=fmtM(o.c)}}

      let [ax,ay]=d.k==='tl'?[x1,y1]:d.k==='tr'?[x0,y1]:d.k==='bl'?[x1,y0]:[x0,y0];
      if(!d.anchor)d.anchor={x:ax,y:ay};
      o.x=d.anchor.x;o.y=d.anchor.y;o.w=snapV(w.x)-o.x;o.h=snapV(w.y)-o.y;
    }
    draw();
  } else if(d.mode==='marquee'){
    ED.marquee={x:Math.min(d.a[0],p[0]),y:Math.min(d.a[1],p[1]),w:Math.abs(p[0]-d.a[0]),h:Math.abs(p[1]-d.a[1])};draw();
  } else if(d.mode==='create'){d.o.pts[1]={x:w.x,y:w.y};draw()}
  else if(d.mode==='free'){const l=d.o.pts[d.o.pts.length-1];if(Math.hypot(w.x-l.x,w.y-l.y)*ED.cam.s>4){d.o.pts.push({x:Math.round(w.x*10)/10,y:Math.round(w.y*10)/10});draw()}}
  else if(d.mode==='zone'){d.o.w=snapV(w.x)-d.o.x;d.o.h=snapV(w.y)-d.o.y;draw()}

    ED.b[k]=v;draw();touch();if(k==='view'){ED.editing=false;ED.fmN=0;renderInspector()}return}
  if(el.dataset.opt){ED[el.dataset.opt]=el.checked;draw()}
  if(el.id==='fmN'){ED.fmN=+el.value;ED.fmH=ED.fmA=null;renderInspector()}
  if(el.id==='fmGk'){ED.fmGk=el.checked;ED.fmH=ED.fmA=null;renderInspector()}
  if(el.id==='fmH')ED.fmH=el.value;if(el.id==='fmA')ED.fmA=el.value;
});
ins.addEventListener('change',()=>{ED.editing=false});
ins.addEventListener('focusout',()=>{ED.editing=false});
ins.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.prop){pushUndo();applyProp(b.dataset.prop,b.dataset.val);commit();renderInspector();return}
  const a=b.dataset.act;if(!a)return;
  if(a==='del')deleteSel();else if(a==='dup')dupSel();else if(a==='front')reorder(true);else if(a==='back')reorder(false);
  else if(a.startsWith('al-'))align(a.slice(3));
  else if(a==='form-home'){ED.fmH=$('#fmH').value;placeFormation('home',ED.fmH)}
  else if(a==='form-away'){ED.fmA=$('#fmA').value;placeFormation('away',ED.fmA)}
  else if(a==='flip'){pushUndo();for(const o of selObjs())if(o.pts){o.pts.reverse();o.c=-(o.c||0)}commit();renderInspector()}
  else if(a==='straight'){pushUndo();for(const o of selObjs())o.c=0;commit();renderInspector()}
});

/* steps / animation */
function renderFrames(){
  const b=ED.b;if(!b)return;const n=b.frames.length,cur=ED.playing&&ED.t!=null?Math.min(Math.round(ED.t),n-1):ED.frame;
  $('#frames').innerHTML=`<span class="lbl">Étapes</span>${b.frames.map((_,i)=>`<button class="fchip ${i===cur?'on':''}" data-frame="${i}" aria-label="Étape ${i+1}">${i+1}</button>`).join('')}
    <button class="btn" data-fact="add" title="Nouvelle étape : les joueurs gardent leur position, déplace-les ensuite">${ICON.plus}<span class="ed-hide-m">Étape</span></button>
    ${n>1?`<button class="btn ghost danger" data-fact="del" title="Supprimer l’étape affichée">Retirer l’étape ${ED.frame+1}</button>`:''}
    <span class="sep"></span>
    <button class="btn ${ED.playing?'':'primary'}" data-fact="play" ${n<2?'disabled':''}>${ED.playing?'Pause':'Lecture'}</button>
    <select data-fact="speed" aria-label="Durée des transitions">${[[.8,'Rapide'],[1.4,'Normal'],[2.2,'Lent']].map(([v,l])=>`<option value="${v}" ${+v===ED.speed?'selected':''}>${l}</option>`).join('')}</select>
    <label class="check" style="white-space:nowrap"><input type="checkbox" data-fact="loop" ${ED.loop?'checked':''}> Boucle</label>
    <span class="muted ed-hide-m" style="font-size:12.5px;white-space:nowrap">${n<2?'Ajoute une étape, déplace joueurs et ballon, puis lance la lecture.':'Les flèches d’une étape annoncent le mouvement vers la suivante.'}</span>`;
}
$('#frames').addEventListener('click',e=>{
  const f=e.target.closest('[data-frame]');if(f){stopPlay();ED.frame=+f.dataset.frame;ED.sel.clear();renderFrames();renderInspector();setHint();draw();return}
  const b=e.target.closest('[data-fact]');if(!b)return;const a=b.dataset.fact;
  if(a==='add'){stopPlay();pushUndo();ED.b.frames.push({});ED.frame=ED.b.frames.length-1;renderFrames();setHint();renderInspector();commit()}
  else if(a==='del'){stopPlay();const i=ED.frame;if(ED.b.frames.length<2)return;pushUndo();
    if(i===0){const f1=ED.b.frames[1]||{};for(const o of ED.b.objs){const q=f1[o.id];if(q){o.x=q.x;o.y=q.y}}ED.b.frames.splice(1,1)}else ED.b.frames.splice(i,1);
    ED.b.objs=ED.b.objs.filter(o=>o.step==null||o.step!==i);ED.b.objs.forEach(o=>{if(o.step!=null&&o.step>i)o.step--});
    if(ED.b.frames.length<2)ED.b.objs.forEach(o=>{if('step' in o)o.step=null});
    ED.frame=Math.max(0,Math.min(i,ED.b.frames.length-1));ED.sel.clear();renderFrames();renderInspector();setHint();commit()}
  else if(a==='play'){ED.playing?stopPlay():play()}
});
$('#frames').addEventListener('change',e=>{const a=e.target.dataset.fact;if(a==='speed')ED.speed=+e.target.value;if(a==='loop')ED.loop=e.target.checked});
function timeline(n){const T=ED.speed*1000,H=600;return {T,H,total:(n-1)*(T+H)+H,at(e){const seg=T+H,k=Math.floor(e/seg);if(k>=n-1)return n-1;const r=e-k*seg;return r<H?k:k+(r-H)/T}}}
function play(){
  const n=ED.b.frames.length;if(n<2){toast('Ajoute au moins une deuxième étape pour animer.');return}
  ED.playing=true;ED.sel.clear();renderInspector();const tl=timeline(n);let st=performance.now();let last=-1;
  const tick=now=>{if(!ED.playing||!ED.b)return;let e=now-st;if(e>tl.total){if(ED.loop){st=now;e=0}else{stopPlay(n-1);return}}
    ED.t=tl.at(e);const r=Math.min(Math.round(ED.t),n-1);if(r!==last){last=r;renderFrames()}draw();requestAnimationFrame(tick)};
  renderFrames();requestAnimationFrame(tick);
}
function stopPlay(endFrame){if(!ED.playing)return;ED.playing=false;if(endFrame!=null)ED.frame=endFrame;ED.t=null;renderFrames();draw()}

/* exports from editor */
function renderOff(board,w,opt={}){const v=viewRect(board),h=Math.round(w*v.h/v.w/2)*2,c=document.createElement('canvas');c.width=w;c.height=h;drawBoard(c.getContext('2d'),board,w,h,opt);return c}
$('#edPng').onclick=()=>{const c=renderOff(ED.b,2000,{frame:ED.frame});c.toBlob(blob=>{if(blob)saveFile(`${slug(ED.blk.name)}${ED.b.frames.length>1?'-etape-'+(ED.frame+1):''}.png`,blob)},'image/png')};
$('#edVideo').onclick=async()=>{
  const n=ED.b.frames.length;if(n<2){toast('Ajoute au moins deux étapes pour exporter une vidéo.');return}
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast('Ce navigateur ne permet pas l’export vidéo.');return}
  stopPlay();const v=viewRect(ED.b),W=1280,H=Math.round(W*v.h/v.w/2)*2,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4;codecs=avc1','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime){toast('Ce navigateur ne permet pas l’export vidéo.');return}
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:5e6}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const btn=$('#edVideo');btn.disabled=true;btn.textContent='Enregistrement…';
  const tl=timeline(n),total=tl.total+800;rec.start();const st=performance.now();
  await new Promise(res=>{const tick=now=>{const e=now-st;drawBoard(x,ED.b,W,H,{t:Math.min(tl.at(e),n-1)});if(e<total)requestAnimationFrame(tick);else res()};requestAnimationFrame(tick)});
  rec.stop();await new Promise(r=>rec.onstop=r);btn.disabled=false;btn.textContent='Vidéo';
  const vext=mime.startsWith('video/mp4')?'mp4':'webm';saveFile(`${slug(ED.blk.name)}.${vext}`,new Blob(chunks,{type:'video/'+vext}));
};

/* ============ PDF ============ */
const pdfT=s=>String(s??'').replace(/[’‘′]/g,"'").replace(/[“”″]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/[  ]/g,' ').replace(/[↔↕→]/g,'-');
$('#btnPdf').onclick=()=>{
  const m=openModal(`<div class="dlg-head"><h3>Fiche séance PDF</h3></div><div class="dlg-body">
    <p class="muted" style="margin:0;font-size:14px">A4 paysage : en-tête, matériel, puis 4 exercices par page.</p>
    <label class="radio-card"><input type="radio" name="ink" value="color" checked><span>Schémas en couleur<small>Pelouse et couleurs du tableau</small></span></label>
    <label class="radio-card"><input type="radio" name="ink" value="print"><span>Économie d’encre<small>Fond blanc, tracés gris : idéal pour imprimer au club</small></span></label>
    </div><div class="dlg-foot"><button class="btn" data-close>Annuler</button><button class="btn primary" id="goPdf">Télécharger le PDF</button></div>`,'small');
  $('#goPdf',m).onclick=()=>{const ink=$('input[name=ink]:checked',m).value==='print';closeModal();exportPDF(ink)};
};
async function exportPDF(print){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('Le module PDF n’a pas pu se charger. Vérifie ta connexion puis réessaie.');return}
  const s=S.cur,doc=new J({orientation:'landscape',unit:'mm',format:'a4'}),PW=297,PH=210,M=10;
  const t0=startMin(s),tot=totalDur(s);
  const dstr=s.date?new Date(s.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
  // header
  doc.setFillColor(10,21,40);doc.rect(0,0,PW,27,'F');
  let tx0=M;
  if(s.num){const lbl=pdfT('SÉANCE N° '+s.num);doc.setFont('helvetica','bold');doc.setFontSize(8.5);const bw=doc.getTextWidth(lbl)+6;
    doc.setFillColor(...phRGB('forme'));doc.roundedRect(M,5.4,bw,7.6,1.2,1.2,'F');doc.setTextColor(255,255,255);doc.text(lbl,M+3,10.4);tx0=M+bw+3}
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text(doc.splitTextToSize(pdfT(s.title||'Séance'),190-(tx0-M))[0]||'',tx0,11.5);
  doc.setFont('helvetica','normal');doc.setFontSize(8.6);doc.setTextColor(176,194,220);
  doc.text(pdfT([s.coach?`Éducateur : ${s.coach}`:'',dstr,s.start?`${s.start} - ${hm(t0+tot)}`:'',s.team,s.theme,s.size?`${s.size} joueurs`:''].filter(Boolean).join('  ·  ')),M,18);

  const kp=[[tot+"'",'DURÉE'],[String(s.blocks.length),'EXERCICES']];
  kp.forEach((k,i)=>{const x=PW-M-2*25+i*25;doc.setDrawColor(60,80,110);doc.roundedRect(x,5,23,17,1.5,1.5);doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(k[0],x+11.5,13.5,{align:'center'});doc.setFont('helvetica','normal');doc.setFontSize(6.2);doc.setTextColor(150,170,200);doc.text(k[1],x+11.5,18.5,{align:'center'})});
  const sx=M,sw=PW-2*M,sy=27,sh=0;
  // equipment
  const eq={};let ma=0,mn=0;s.blocks.forEach(b=>{const c={};let a=0,n=0;b.board.objs.forEach(o=>{c[o.t]=(c[o.t]||0)+1;if(o.t==='player'){if(o.team==='away')a++;if(o.team==='neutral')n++}});for(const k in c)eq[k]=Math.max(eq[k]||0,c[k]);ma=Math.max(ma,a);mn=Math.max(mn,n)});
  const eqs=EQUIP.filter(([k])=>eq[k]).map(([k,l])=>`${eq[k]} ${l.toLowerCase()}`);if(ma||mn)eqs.push(`chasubles : ${[ma?ma+' adverses':'',mn?mn+' neutres':''].filter(Boolean).join(', ')}`);
  doc.setFontSize(7.4);doc.setTextColor(13,27,46);doc.setFont('helvetica','bold');doc.text('MATÉRIEL',M,sy+sh+5.5);doc.setFont('helvetica','normal');doc.text(pdfT(eqs.join('  ·  ')||'-'),M+16,sy+sh+5.5,{maxWidth:sw-16});
  // grid
  let acc=t0;const starts=s.blocks.map(b=>{const a=acc;acc+=+b.dur||0;return a});
  const gapG=5,cw=(PW-2*M-gapG)/2;let page=0,top=sy+sh+9.5;
  for(let i=0;i<s.blocks.length;i++){
    const slot=page===0?i%4:(i-4)%4;
    if(i===4||(i>4&&(i-4)%4===0)){doc.addPage();page++;top=16;doc.setFillColor(10,21,40);doc.rect(0,0,PW,10,'F');doc.setTextColor(255,255,255);doc.setFontSize(8.5);doc.setFont('helvetica','bold');doc.text(pdfT((s.num?`Séance n° ${s.num}  ·  `:'')+s.title),M,6.6);doc.setFont('helvetica','normal');doc.text(pdfT(dstr),PW-M,6.6,{align:'right'})}
    const ch=(PH-8-top-gapG)/2,x=M+(slot%2)*(cw+gapG),yy=top+Math.floor(slot/2)*(ch+gapG);
    pdfCell(doc,s.blocks[i],i,starts[i],x,yy,cw,ch,print);
  }
  const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(6.5);doc.setTextColor(130,140,155);doc.text(pdfT([s.num?`Séance n° ${s.num}`:'',s.coach,s.team].filter(Boolean).join('  ·  ')),M,PH-3.5);doc.text(`${p}/${pages}`,PW-M,PH-3.5,{align:'right'})}
  await saveFile(`seance-${s.date||todayISO()}-${slug(s.title)}.pdf`,doc.output('blob'));
}
function pdfCell(doc,b,i,st,x,y,w,h,print){
  doc.setDrawColor(214,221,231);doc.setFillColor(255,255,255);doc.roundedRect(x,y,w,h,2,2,'FD');
  doc.setFillColor(...phRGB(b.phase));doc.roundedRect(x+3,y+3,6.5,6.5,1,1,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(String(i+1),x+6.25,y+7.6,{align:'center'});
  doc.setTextColor(13,27,46);doc.setFontSize(10.5);doc.text(doc.splitTextToSize(pdfT(b.name),w-80)[0]||'',x+12,y+7.8);
  doc.setFont('helvetica','normal');doc.setFontSize(7.4);doc.setTextColor(90,106,128);doc.text(pdfT(`${PHASES[b.phase]||''}  ·  ${hm(st)} - ${hm(st+(+b.dur||0))}  ·  ${b.dur} min`),x+w-3,y+7.8,{align:'right'});
  // diagram
  const ar=boardAspect(b.board),maxW=w*.52,maxH=h-15;let dw=maxW,dh=dw/ar;if(dh>maxH){dh=maxH;dw=dh*ar}
  const c=renderOff(b.board,Math.round(dw*9),{frame:0,print});doc.addImage(c.toDataURL('image/jpeg',.9),'JPEG',x+3,y+12,dw,dh);
  if(b.board.frames.length>1){doc.setFontSize(6.2);doc.setTextColor(90,106,128);doc.text(`Animation : ${b.board.frames.length} étapes (étape 1 représentée)`,x+3,y+12+dh+3)}
  // text column
  const tx=x+3+dw+4,tw=x+w-3-tx;let ty=y+13.5;const bottom=y+h-3;
  const meta=[['Espace',b.space||autoSpace(b)],['Joueurs',b.players||autoPlayers(b)]].filter(m=>m[1]);
  doc.setFontSize(7.2);
  for(const [k,v] of meta){doc.setFont('helvetica','bold');doc.setTextColor(13,27,46);doc.text(k,tx,ty);doc.setFont('helvetica','normal');const l=doc.splitTextToSize(pdfT(v),tw-15);doc.text(l[0],tx+15,ty);ty+=3.6}
  ty+=1.2;
  for(const [k,v] of [['CONSIGNES',b.org],['VARIANTES',b.var]]){
    if(!v||ty>bottom-5)continue;
    doc.setFont('helvetica','bold');doc.setFontSize(6.4);doc.setTextColor(...phRGB(b.phase));doc.text(k,tx,ty);ty+=3;
    doc.setFont('helvetica','normal');doc.setFontSize(7.1);doc.setTextColor(30,42,60);
    let lines=doc.splitTextToSize(pdfT(v),tw);const room=Math.floor((bottom-ty)/3.1);
    if(lines.length>room){lines=lines.slice(0,Math.max(0,room));if(lines.length)lines[lines.length-1]=lines[lines.length-1].replace(/\s*\S*$/,'')+'...'}
    if(lines.length){doc.text(lines,tx,ty);ty+=lines.length*3.1+1.6}
  }
}

/* ============ json backup ============ */
$('#btnJson').onclick=()=>{const s=clone(S.cur);delete s.example;saveFile(`seance-${s.date||todayISO()}-${slug(s.title)}.json`,JSON.stringify({app:'coach-pro-studio',version:1,session:s},null,1))};
$('#btnImport').onclick=()=>$('#fileIn').click();
$('#btnRestore').onclick=()=>$('#fileIn').click();
$('#btnBackup').onclick=()=>{
  const sessions=[...S.sessions.values()].map(x=>{const c=clone(x);delete c.example;return c}),exercises=[...S.exercises.values()].map(clone);
  if(!sessions.length&&!exercises.length){toast('Aucune séance enregistrée à exporter.');return}
  saveFile(`coach-pro-studio-sauvegarde-${todayISO()}.json`,JSON.stringify({app:'coach-pro-studio',version:1,exportedAt:new Date().toISOString(),sessions,exercises}));
};
$('#fileIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch{toast('Ce fichier n’est pas une sauvegarde Coach Pro Studio valide.');return}
  if(d&&Array.isArray(d.sessions)){
    const list=[...d.sessions.filter(x=>x&&Array.isArray(x.blocks)).map(x=>({...x,kind:'session'})),...(d.exercises||[]).filter(x=>x&&x.board).map(x=>({...x,kind:'exercise'}))].filter(x=>x.id);
    if(!list.length){toast('Cette sauvegarde ne contient aucune séance.');return}
    list.forEach(ingest);
    try{if(S.store.mode==='idb')await IDB.putMany(list.map(x=>{const c=clone(x.kind==='session'?S.sessions.get(x.id):S.exercises.get(x.id));delete c.example;return c}));else lsWrite()}catch{toast('Restauration incomplète : stockage de l’appareil indisponible.');return}
    const n=list.filter(x=>x.kind==='session').length;
    if(S.cur.example||!S.sessions.has(S.cur.id)){const m=mostRecent();if(m)S.cur=m}
    renderPlan();renderSide();statusIdle();toast(`${n} séance${n>1?'s':''} restaurée${n>1?'s':''}.`);return}
  try{const s=d.session||d;if(!s||!Array.isArray(s.blocks))throw 0;
    s.id=nid('s');s.kind='session';delete s.example;normalize(s);s.blocks.forEach(b=>{b.id=nid('b');if(!b.board)b.board=newBoard();if(!b.board.frames)b.board.frames=[{}]});
    S.cur=s;touch();renderPlan();toast('Séance importée.')}
  catch{toast('Ce fichier n’est pas une sauvegarde Coach Pro Studio valide.')}
};

/* ============ boot ============ */
S.cur=exampleSession();
renderPlan();renderSide();statusIdle();
initStore();
document.fonts&&document.fonts.ready.then(()=>{renderThumbs();if(ED.b){draw();renderPalette()}});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if($('#editor').hidden)renderThumbs()},150)});
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#btnInstall').hidden=false});
window.addEventListener('appinstalled',()=>{deferredInstall=null;$('#btnInstall').hidden=true;toast('Coach Pro Studio est installé.')});
$('#btnInstall').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch{}deferredInstall=null;$('#btnInstall').hidden=true};
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
window.addEventListener('pagehide',()=>{if(S.timer){clearTimeout(S.timer);S.timer=null;persist(S.cur.id)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S.timer){clearTimeout(S.timer);S.timer=null;persist(S.cur.id)}});
